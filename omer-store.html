.hero>div{position:relative;z-index:1;max-width:760px}.hero .logo{font-size:clamp(56px,13vw,150px);line-height:1;animation:in 1.4s ease both}
.hero h1{font-size:clamp(26px,4vw,44px);margin:28px 0 12px}.hero p{color:#cfc6b6;margin:0 0 32px}
@keyframes in{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.32em}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{display:inline-block;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:13px 30px;cursor:pointer;font-size:14px;letter-spacing:.06em;transition:.25s}.btn:hover{background:transparent;color:var(--fg)}
.hero .btn{background:#f3eee6;color:#141414;border-color:#f3eee6}.hero .btn:hover{background:transparent;color:#f3eee6}
.btn.o{background:transparent;color:var(--fg)}.btn.o:hover{background:var(--fg);color:var(--bg)}.btn.s{padding:6px 14px;font-size:13px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}.sh h2{font-size:clamp(28px,3.4vw,40px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 20px}
.card .im{aspect-ratio:4/5;overflow:hidden;background:var(--sand)}.card .im>*{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover .im>*{transform:scale(1.04)}
.card h3{font-size:20px;margin:12px 0 2px}.card span{color:var(--mut);font-size:14px}.card s{margin-inline-start:8px;opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{aspect-ratio:4/3;position:relative;display:flex;align-items:flex-end;padding:28px;color:#f3eee6;overflow:hidden}.tile svg{position:absolute;inset:0;width:100%;height:100%}.tile h3{font-size:34px;position:relative}
.strip{background:var(--sand);color:#141414}.strip .w{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding:36px 24px;text-align:center}.strip h3{font-size:22px}.strip p{margin:4px 0 0;font-size:14px}
.q{border-inline-start:2px solid var(--sand);padding-inline-start:16px}.q p{font-family:var(--serif);font-size:22px;margin:0 0 6px;line-height:1.3}[dir=rtl] .q p{font-family:'Cairo'}
.nl{background:radial-gradient(70% 120% at 50% 0%,#3a3328,#141414 70%);color:#f3eee6;text-align:center}.nl form{display:flex;max-width:460px;margin:20px auto 0;gap:8px}.nl input{flex:1;padding:12px;background:transparent;border:1px solid #555;color:#f3eee6}
footer{background:#0e0e0e;color:#b9b2a5;font-size:14px}footer .w{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding:44px 24px}footer h4{color:#f3eee6;margin:0 0 8px;font-weight:500}footer a{display:block;padding:2px 0}footer a:hover{color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.chip{border:1px solid var(--line);padding:6px 14px;font-size:14px;cursor:pointer;background:none}.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:48px}.pd .big{aspect-ratio:4/5;background:var(--sand);overflow:hidden}.pd .big>*{width:100%;height:100%;object-fit:cover}.th{display:flex;gap:8px;margin-top:8px}.th div{width:72px;aspect-ratio:4/5;cursor:pointer;border:1px solid transparent;overflow:hidden}.th .on{border-color:var(--fg)}.th>div>*{width:100%;height:100%;object-fit:cover}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.sz{min-width:46px;padding:8px;text-align:center;border:1px solid var(--line);cursor:pointer;background:none}.sz.on{background:var(--fg);color:var(--bg)}.sz.x{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;outline-offset:3px}.sw.on{outline:2px solid var(--fg)}
.qty{display:inline-flex;border:1px solid var(--line)}.qty button{width:38px;border:0;background:none;cursor:pointer;font-size:18px}.qty span{width:38px;text-align:center;line-height:38px}
.ok{color:#3f7a4a}.no{color:#a33}.mut{color:var(--mut)}
